name: Focused order diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin-platform-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      MEDIA_FFPROBE_PATH: /usr/bin/ffprobe
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            related/admin/package-lock.json
            related/website/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: supabase start
      - name: Install fixed application dependencies and browser engines
        run: |
          node scripts/platform/prepare.mjs
          cd .lumiq-local/verification/related/website
          npx playwright install --with-deps chromium firefox webkit chrome
          cd ../admin
          npx playwright install --with-deps chromium
      - name: Seed bundled publication in disposable database
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const snapshot=JSON.stringify(JSON.parse(fs.readFileSync('related/admin/features/content/initial-snapshot.json','utf8'))).replaceAll("'", "''");
          const actor='d1a60000-0000-4000-8000-000000000001',draft='d1a60000-0000-4000-8000-000000000002',release='d1a60000-0000-4000-8000-000000000003';
          const query=`begin; insert into public.content_drafts(id,version,snapshot,created_by,updated_by) values('${draft}',1,'${snapshot}'::jsonb,'${actor}','${actor}'); insert into public.content_releases(id,snapshot,draft_id,draft_version,created_by) values('${release}','${snapshot}'::jsonb,'${draft}',1,'${actor}'); update public.content_publication set release_id='${release}'; commit;`;
          execFileSync('docker',['exec','-i','supabase_db_lumiq-platform','psql','-U','postgres','-d','postgres','-v','ON_ERROR_STOP=1'],{input:query,stdio:['pipe','inherit','inherit']});
          JS
      - name: Run local verification (SQL precedes synthetic browser accounts)
        run: node scripts/verify-platform.mjs --stage=browsers --browser-from=admin-catalog
      - name: Remove ephemeral database and local credentials
        if: always()
        run: |
          supabase stop --no-backup
          rm -f .lumiq-local/test.env
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-verification
          path: .lumiq-local/evidence
          retention-days: 7
