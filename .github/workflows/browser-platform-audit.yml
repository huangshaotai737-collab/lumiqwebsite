name: Browser and operating system audit
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: browser-audit-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # Windows installs can consume over eight minutes before browser checks.
    # Keep per-operation deadlines; allow time for all four browser engines.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: related/website
        shell: bash
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      DEBUG: pw:browser
      LUMIQ_STATIC_IMAGES: '1'
      SITE_URL: http://localhost:4223
      QA_OUTPUT: qa/release-platform
      TEST_EDGE: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: related/website/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - if: runner.os == 'Windows'
        run: npx playwright install msedge
      - run: sudo apt-get install -y gstreamer1.0-gl gstreamer1.0-tools gdb xvfb xauth gdb
      - run: gst-inspect-1.0 glimagesink
      - run: npm test
      - run: npm run build
      - run: xvfb-run -a node scripts/run-platform-ci.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit-${{ runner.os }}
          path: related/website/qa/release-platform
          retention-days: 14
