# Shared local backend. Run all CLI commands from the repository root.
project_id = "lumiq-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = false

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:4250"
additional_redirect_urls = ["http://127.0.0.1:4250/auth/callback", "http://127.0.0.1:4211/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[analytics]
enabled = false

[edge_runtime]
enabled = false
